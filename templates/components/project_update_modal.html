<div id="update-project-modal"
     class="form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-project-modal-title">
    <button type="button"
            class="form-modal__backdrop"
            popovertarget="update-project-modal"
            popovertargetaction="hide"
            aria-label="Close add project form"></button>

    <div class="form-modal__content">
        <button type="button"
                class="form-modal__close"
                popovertarget="update-project-modal"
                popovertargetaction="hide"
                aria-label="Close add project form">×</button>

        <h2 id="add-project-modal-title">Update Project</h2>
        <form id="project-update"
              class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="update-project-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Update Project</button>
            </div>
        </form>
    </div>
</div>
