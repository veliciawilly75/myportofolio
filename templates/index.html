{% extends 'base.html' %}
{% block meta %}
    <title>Profile - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                    
                </div>
                <div class="hero-info">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Last Login Session</dt>
                            <dd>{{ last_login }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/veliciawilly75" class="social-link">GitHub</a>
                        <a href="https://linkedin.com/in/velicia-willy-378002380" class="social-link">LinkedIn</a>
                        <a href="mailto:velicia.willy@ui.ac.id" class="social-link">Email</a>
                    </div>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/myphoto.jpeg" alt="Photo of {{ name }}">
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
